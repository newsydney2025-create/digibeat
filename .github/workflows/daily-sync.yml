name: Daily Data Sync

on:
  schedule:
    # Runs at 11:00 UTC everyday
    # During AEST (UTC+10), this is 21:00 Sydney
    # During AEDT (UTC+11), this is 22:00 Sydney
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync API
        run: |
          curl -X POST https://digibeat.vercel.app/api/sync \
          -H "Content-Type: application/json" \
          -d '{"is_daily": true, "platform": "all"}'
