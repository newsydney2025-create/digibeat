name: Daily Data Sync

on:
  schedule:
    # Backup trigger, 30 minutes after Vercel Cron.
    # During AEST (UTC+10), this is 21:30 Sydney.
    # During AEDT (UTC+11), this is 22:30 Sydney.
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Sync API
        run: |
          curl -fsS https://digibeat.vercel.app/api/sync \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Wait for Apify webhooks
        run: sleep 480

      - name: Verify daily sync data landed
        run: |
          curl -fsS https://digibeat.vercel.app/api/sync/health \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
